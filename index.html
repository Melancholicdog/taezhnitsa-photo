<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#152d23"><meta name="description" content="Фотокаталог продукции Таёжница и Медоед шоколад"><title>Таёжница × Медоед — фотокаталог</title>
<style>
:root{--forest:#172f23;--cream:#f7f5ed;--gold:#c8a978}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,Helvetica,sans-serif;color:#26382e}button{cursor:pointer;font:inherit}header{background:#101e18;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:24px max(22px,calc((100vw - 1200px)/2))}header b{font:26px Georgia,serif;letter-spacing:.06em}header small{color:#c3bdad;letter-spacing:.19em;font-size:10px}.hero{color:#fff;background:radial-gradient(circle at 83% 29%,#3a6545,transparent 40%),linear-gradient(145deg,#0c1d14,#21432e);padding:105px max(24px,calc((100vw - 1200px)/2)) 110px}.kicker{color:#dac295;font-size:12px;letter-spacing:.25em;font-weight:700}.hero h1{font:normal clamp(48px,7vw,95px)/1 Georgia,serif;letter-spacing:-.05em;margin:20px 0 21px}.hero h1 em{color:#dac295;font-weight:400}.hero p{max-width:610px;line-height:1.7;color:#d0dfd5;font-size:17px}.hero button{background:#dac295;border:0;padding:15px 25px;border-radius:40px;color:#1a3023;font-weight:bold;margin-top:18px}.wrap{max-width:1250px;padding:65px 24px 100px;margin:auto}h2{font:normal 54px Georgia,serif;letter-spacing:-.04em;margin:0 0 20px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 32px}.tab{border-radius:30px;border:1px solid #d3d6cb;background:#fff;padding:13px 19px;color:#345043}.tab.active{color:#fff;background:var(--forest);border-color:var(--forest)}#count{color:#758276;font-size:13px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.tile{border:0;padding:0;border-radius:13px;overflow:hidden;background:white;text-align:left;box-shadow:0 10px 30px #1e2d1c0d;transition:transform .2s}.tile:hover{transform:translateY(-4px)}.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.info{padding:18px}.info small{font-size:10px;letter-spacing:.16em;color:#937848;font-weight:700}.info strong{font:normal 21px Georgia,serif;display:block;margin-top:8px}.empty{grid-column:1/-1;border:1px dashed #c8d0c5;border-radius:18px;text-align:center;padding:65px 20px;color:#67776c}.empty h3{font:normal 29px Georgia,serif;color:#24392a}footer{background:#101e18;color:#9fad9f;padding:32px;text-align:center;font-size:12px;letter-spacing:.12em}
.viewer{position:fixed;inset:0;background:#090e0cf5;z-index:9;display:none;align-items:center;justify-content:center;padding:65px 75px 95px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:calc(100vh - 175px);object-fit:contain}.control{position:absolute;border:1px solid #ffffff40;color:white;background:#ffffff22;border-radius:50%;width:45px;height:45px;font-size:25px}.close{right:22px;top:20px}.prev{left:20px;top:50%}.next{right:20px;top:50%}.share{right:22px;bottom:22px;font-size:18px}.caption{position:absolute;left:24px;bottom:25px;right:80px;color:#fff;font:normal 20px Georgia,serif}.caption small{display:block;font:12px Arial,sans-serif;color:#b7c6b9;margin-top:8px}#msg{display:none;position:fixed;z-index:20;bottom:24px;left:50%;transform:translateX(-50%);background:#163b27;color:white;border-radius:35px;padding:14px 20px;white-space:nowrap;font-size:13px}
@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:70px 23px 85px}.wrap{padding:48px 15px}.viewer{padding:65px 12px 95px}.viewer img{max-height:calc(100vh - 170px)}header{padding:20px}}
@media(max-width:500px){.gallery{grid-template-columns:1fr}.hero p{font-size:15px}.hero h1{font-size:50px}h2{font-size:41px}header small{display:none}.tile img{aspect-ratio:4/3}}
</style><script src="photos.js" defer></script></head>
<body><header><b>ТАЁЖНИЦА ✳</b><small>КОЛЛЕКЦИЯ ПРОДУКЦИИ</small></header>
<section class="hero"><div class="kicker">ФОТОКАТАЛОГ · ТАЁЖНИЦА И МЕДОЕД</div><h1>Природа.<br>Вкус. <em>История.</em></h1><p>Фотографии продукции, новые коллекции и подарочные серии. Выберите бренд и рассмотрите каждую упаковку.</p><button id="go">Смотреть фотографии ↓</button></section>
<main class="wrap" id="catalog"><h2>Коллекция</h2><div id="count"></div><nav class="tabs" aria-label="Выбор бренда"><button class="tab active" data-brand="all">Все фотографии</button><button class="tab" data-brand="taezhnitsa">Таёжница</button><button class="tab" data-brand="medoed">Медоед шоколад</button></nav><div id="gallery" class="gallery"></div></main>
<footer>ТАЁЖНИЦА × МЕДОЕД ШОКОЛАД · ФОТОКАТАЛОГ</footer>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Просмотр фотографии"><button class="control close" id="close" aria-label="Закрыть">×</button><button class="control prev" id="prev" aria-label="Предыдущее фото">‹</button><img id="big" alt=""><button class="control next" id="next" aria-label="Следующее фото">›</button><div class="caption"><span id="bigTitle"></span><small id="n"></small></div><button class="control share" id="share" aria-label="Поделиться фотографией">↗</button></div><div id="msg"></div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const photos=Array.isArray(window.CATALOG_PHOTOS)?window.CATALOG_PHOTOS:[],grid=document.querySelector('#gallery'),viewer=document.querySelector('#viewer'),big=document.querySelector('#big');let brand='all',shown=[],pos=-1,start=0;
 const q=s=>document.querySelector(s);
 const toast=m=>{q('#msg').textContent=m;q('#msg').style.display='block';setTimeout(()=>q('#msg').style.display='none',2200)};
 function render(){shown=photos.filter(p=>brand==='all'||p.brand===brand);grid.replaceChildren();q('#count').textContent=shown.length+' фотографий';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.brand===brand));if(!shown.length){let e=document.createElement('div');e.className='empty';e.innerHTML='<h3>Фотографии появятся здесь</h3><p>Новые обложки добавим, когда они будут готовы.</p>';grid.append(e);return}
 shown.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','Открыть фото '+p.title);const img=document.createElement('img');img.src=p.src;img.loading='lazy';img.alt=p.title;const d=document.createElement('div');d.className='info';const small=document.createElement('small');small.textContent=p.brand==='medoed'?'МЕДОЕД ШОКОЛАД':'ТАЁЖНИЦА';const title=document.createElement('strong');title.textContent=p.title;d.append(small,title);b.append(img,d);b.onclick=()=>open(i);grid.append(b)})}
 function open(i){pos=i;viewer.classList.add('open');document.body.style.overflow='hidden';show()}
 function show(){if(pos<0)return;const p=shown[pos];big.src=p.src;big.alt=p.title;q('#bigTitle').textContent=p.title;q('#n').textContent=(pos+1)+' / '+shown.length}
 function close(){viewer.classList.remove('open');document.body.style.overflow='';pos=-1}
 function move(d){if(pos>=0&&shown.length){pos=(pos+d+shown.length)%shown.length;show()}}
 async function share(){const u=new URL(location.href);u.hash='photo='+encodeURIComponent(shown[pos].id);try{if(navigator.share){await navigator.share({url:u.href,title:shown[pos].title})}else if(navigator.clipboard){await navigator.clipboard.writeText(u.href);toast('Ссылка скопирована')}else prompt('Ссылка:',u.href)}catch(e){if(e.name!=='AbortError')prompt('Ссылка:',u.href)}}
 q('#go').onclick=()=>q('#catalog').scrollIntoView({behavior:'smooth'});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{brand=b.dataset.brand;render()});q('#close').onclick=close;q('#prev').onclick=()=>move(-1);q('#next').onclick=()=>move(1);q('#share').onclick=share;viewer.onclick=e=>{if(e.target===viewer)close()};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});viewer.addEventListener('touchstart',e=>start=e.changedTouches[0].screenX,{passive:true});viewer.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-start;if(Math.abs(d)>60)move(d<0?1:-1)},{passive:true});render();
 const id=decodeURIComponent(location.hash.slice(7));if(location.hash.startsWith('#photo=')){const p=photos.find(x=>x.id===id);if(p){brand=p.brand;render();open(shown.findIndex(x=>x.id===id))}}
});
</script></body></html>
